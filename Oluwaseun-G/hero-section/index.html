<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0ec">
  <title>Fresh Lime — Soft Drink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <header class="topbar">
      <a class="logo" href="#" aria-label="Logo Ipsum home">LOGO<small>IPSUM</small></a>
      <nav aria-label="Main navigation">
        <a href="#about">About Us</a><a href="#blogs">Blogs</a><a href="#faqs">FAQs</a><a href="#contact">Contact Us</a>
        <a class="bag" href="#buy" aria-label="Shopping bag"><i></i></a>
      </nav>
    </header>

    <p class="intro">Elevate your culinary rituals with<br> our the touch of soft drink</p>
    <span class="lemon lemon-one" aria-hidden="true"></span>
    <span class="lemon lemon-two" aria-hidden="true"></span>

    <div class="can" role="img" aria-label="Soft Drink, 100% pure and natural lemon">
      <div class="can-top"></div>
      <div class="can-brand">BRAND</div>
      <div class="can-art"><i></i><b></b></div>
      <div class="soft">Soft</div>
      <div class="drink">DRINK</div>
      <div class="can-swoosh"></div>
      <div class="lemon-slice"></div>
      <div class="can-claim">100% LEMON<br><small>PURE AND NATURAL</small></div>
      <div class="can-base"></div>
    </div>
    <span class="green-dot" aria-hidden="true"></span>

    <h1>Fresh Lime</h1>
    <button class="buy" id="buy">Buy Now</button>
    <p class="flavour">INFUSED WITH MINT FLAVOUR</p>
    <div class="pedestal" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
